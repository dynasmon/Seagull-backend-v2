# The backbone network is internal, so neither the broker nor the store is
# reachable from the host and their ports cannot be published. The integration
# suite runs on the host and needs both, so the exposure is an explicit,
# separate decision.

networks:
  backbone-testing: {}

services:
  redpanda:
    networks: [backbone, backbone-testing]
    ports:
      - "127.0.0.1:19092:19092"

  clickhouse:
    networks: [backbone, backbone-testing]
    ports:
      - "127.0.0.1:19000:9000"

  postgres:
    networks: [backbone, backbone-testing]
    ports:
      - "127.0.0.1:15432:5432"

  # A backbone that authenticates and authorizes, as production runs one, for the
  # suite that holds every component to its grant. Its administrator's password is
  # generated by `make test-integration` and never written into the repository.
  redpanda-secured:
    image: redpandadata/redpanda:v26.2.7@sha256:43545ee03966431f5451e0b3c1e651b39fbe3eb383360220311021f50133b649
    profiles: [secured]
    entrypoint: ["/bin/bash", "/seagull/redpanda-secured.sh"]
    environment:
      SEAGULL_SECURED_ADVERTISED_PORT: "19093"
      RP_BOOTSTRAP_USER: backbone-migrator:${SEAGULL_TEST_SECURED_PASSWORD:-}:SCRAM-SHA-256
    networks: [backbone-testing]
    ports:
      - "127.0.0.1:19093:9093"
    volumes:
      - ./redpanda-secured.sh:/seagull/redpanda-secured.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs the operational alert rules against recorded series and touches nothing
  # else, so it has no network and starts only when asked for.
  promtool:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    profiles: [alerts]
    entrypoint: [promtool]
    network_mode: none
    working_dir: /rules
    volumes:
      - ./prometheus:/rules:ro

  # Reads images and writes nothing but its own database, so it runs as the
  # caller, holds no capability and joins neither the backbone nor the stores.
  # It reads a saved archive rather than the Docker socket, which would be root.
  grype:
    image: anchore/grype:v0.121.3-nonroot@sha256:33559478ce73255cf4457a8343add3693788be2b40dd471c3dac2713f1c80c1d
    profiles: [scan]
    user: ${SEAGULL_RUNTIME_USER:-65532:65532}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      GRYPE_DB_CACHE_DIR: /database
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    volumes:
      - ../dist/images:/images:ro
      - ../dist/grype:/database
