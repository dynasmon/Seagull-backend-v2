# Who may do what, and where. Development material; an estate replaces this file.
#
# Read at startup and never changed by a running process. A permission is written
# `resource:action`; anything undeclared is refused when the file is read.

schema_version: 1

roles:
  - name: analyst
    description: reads what the platform observed and what it decided about it
    permissions:
      - events:read
      - detections:read
      - alerts:read
      - incidents:read
      - agents:read

  - name: responder
    description: works alerts and incidents through their lifecycle without changing what detects them
    permissions:
      - events:read
      - detections:read
      - alerts:read
      - alerts:write
      - incidents:read
      - incidents:write
      - agents:read

  - name: engineer
    description: writes and publishes the rules the analysis engine runs for every tenant
    permissions:
      - events:read
      - detections:read
      - rulesets:read
      - rulesets:write

  - name: tenant-administrator
    description: administers the agents and the work of the tenants it is bound to, and nothing every tenant shares
    permissions:
      - agents:read
      - agents:write
      - agents:delete
      - alerts:delete
      - alerts:read
      - alerts:write
      - detections:read
      - events:read
      - incidents:delete
      - incidents:read
      - incidents:write
      - rulesets:read

  - name: administrator
    description: administers the platform itself, from what detects for every tenant to what an agent may install and who is signed in
    permissions:
      - agents:read
      - agents:write
      - agents:delete
      - alerts:delete
      - alerts:read
      - alerts:write
      - detections:read
      - events:read
      - incidents:delete
      - incidents:read
      - incidents:write
      - policies:read
      - releases:write
      - rulesets:read
      - rulesets:write
      - sessions:read
      - sessions:delete

# A subject is the common name of a verified client certificate. A binding says
# what it reaches: `platform` holds what every tenant shares, `tenant` only what
# belongs to the tenants it lists, and a role carrying a platform permission is
# refused under `tenant` when the file is read. An empty list is never a
# wildcard, and the platform is never every tenant.
bindings:
  - subject: dev-analyst
    roles: [analyst]
    scope: tenant
    tenants: [default]

  - subject: dev-tenant-admin
    roles: [tenant-administrator]
    scope: tenant
    tenants: [default]

  - subject: dev-admin
    roles: [administrator]
    scope: platform
    tenants: [default]
