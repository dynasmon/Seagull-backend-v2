# The backbone network is internal, so neither the broker nor the store is
# reachable from the host and their ports cannot be published. The integration
# suite runs on the host and needs both, so the exposure is an explicit,
# separate decision.

networks:
  backbone-testing: {}

services:
  redpanda:
    networks: [backbone, backbone-testing]
    ports:
      - "127.0.0.1:19092:19092"

  clickhouse:
    networks: [backbone, backbone-testing]
    ports:
      - "127.0.0.1:19000:9000"

  postgres:
    networks: [backbone, backbone-testing]
    ports:
      - "127.0.0.1:15432:5432"

  # Runs the operational alert rules against recorded series and touches nothing
  # else, so it has no network and starts only when asked for.
  promtool:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    profiles: [alerts]
    entrypoint: [promtool]
    network_mode: none
    working_dir: /rules
    volumes:
      - ./prometheus:/rules:ro
