name: seagull-v2

# One declaration of the backbone, read by the command that provisions it and by
# the processes that verify it before they serve.
x-backbone: &backbone
  SEAGULL_BACKBONE_BROKERS: redpanda:9092
  SEAGULL_BACKBONE_EVENTS_TOPIC: security.events.raw
  SEAGULL_BACKBONE_EVENTS_PARTITIONS: ${SEAGULL_BACKBONE_EVENTS_PARTITIONS:-12}
  SEAGULL_BACKBONE_EVENTS_RETENTION: ${SEAGULL_BACKBONE_EVENTS_RETENTION:-168h}
  SEAGULL_BACKBONE_QUARANTINE_TOPIC: security.events.quarantine
  SEAGULL_BACKBONE_QUARANTINE_PARTITIONS: ${SEAGULL_BACKBONE_QUARANTINE_PARTITIONS:-3}
  SEAGULL_BACKBONE_QUARANTINE_RETENTION: ${SEAGULL_BACKBONE_QUARANTINE_RETENTION:-720h}
  SEAGULL_BACKBONE_DETECTIONS_TOPIC: security.detections
  SEAGULL_BACKBONE_DETECTIONS_PARTITIONS: ${SEAGULL_BACKBONE_DETECTIONS_PARTITIONS:-6}
  SEAGULL_BACKBONE_DETECTIONS_RETENTION: ${SEAGULL_BACKBONE_DETECTIONS_RETENTION:-720h}
  SEAGULL_BACKBONE_DETECTIONS_QUARANTINE_TOPIC: security.detections.quarantine
  SEAGULL_BACKBONE_DETECTIONS_QUARANTINE_PARTITIONS: ${SEAGULL_BACKBONE_DETECTIONS_QUARANTINE_PARTITIONS:-3}
  SEAGULL_BACKBONE_DETECTIONS_QUARANTINE_RETENTION: ${SEAGULL_BACKBONE_DETECTIONS_QUARANTINE_RETENTION:-720h}
  SEAGULL_BACKBONE_RULESETS_TOPIC: security.rulesets
  SEAGULL_BACKBONE_REPLICAS: ${SEAGULL_BACKBONE_REPLICAS:-1}
  SEAGULL_BACKBONE_MIN_INSYNC_REPLICAS: ${SEAGULL_BACKBONE_MIN_INSYNC_REPLICAS:-1}
  # Plaintext and unauthenticated is a development posture, stated rather than
  # inherited. A deployment turns both on together; the two never separate,
  # because a password on a plaintext connection is a password given away.
  SEAGULL_BACKBONE_TLS: ${SEAGULL_BACKBONE_TLS:-false}
  SEAGULL_BACKBONE_TLS_CA: ${SEAGULL_BACKBONE_TLS_CA:-}
  SEAGULL_BACKBONE_SASL_MECHANISM: ${SEAGULL_BACKBONE_SASL_MECHANISM:-none}
  SEAGULL_BACKBONE_SASL_USER: ${SEAGULL_BACKBONE_SASL_USER:-}
  SEAGULL_BACKBONE_SASL_PASSWORD: ${SEAGULL_BACKBONE_SASL_PASSWORD:-}

# One declaration of the relational store, read by the command that applies its
# schema and by the two processes that verify it before they serve.
x-alertstore: &alertstore
  SEAGULL_ALERT_STORE_ADDRESS: postgres:5432
  SEAGULL_ALERT_STORE_DATABASE: ${SEAGULL_ALERT_STORE_DATABASE:-seagull}
  SEAGULL_ALERT_STORE_USER: ${SEAGULL_ALERT_STORE_USER:-seagull}
  SEAGULL_ALERT_STORE_PASSWORD: ${SEAGULL_ALERT_STORE_PASSWORD:-seagull}
  SEAGULL_ALERT_STORE_SSLMODE: ${SEAGULL_ALERT_STORE_SSLMODE:-disable}

# The development certificates are owned by whoever ran `make dev-pki`, and the
# private keys stay owner-readable. `make up` passes that identity through so a
# bind mount works without loosening the permissions on a key.
x-hardening: &hardening
  read_only: true
  user: "${SEAGULL_RUNTIME_USER:-65532:65532}"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

networks:
  backbone:
    internal: true
  agents: {}

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.20
    command:
      - redpanda
      - start
      - --node-id=0
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    networks: [backbone]
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applied by a command that runs to completion, never by a process on its way
  # to serving traffic. The gateway and the writer verify the result.
  backbone-migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: backbone-migrator
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [backbone]
    environment:
      <<: *backbone
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
    restart: "no"
    <<: *hardening

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    networks: [backbone]
    environment:
      CLICKHOUSE_DB: ${SEAGULL_EVENT_STORE_DATABASE:-seagull}
      CLICKHOUSE_USER: ${SEAGULL_EVENT_STORE_USER:-seagull}
      CLICKHOUSE_PASSWORD: ${SEAGULL_EVENT_STORE_PASSWORD:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applied by a command that runs to completion, never by a process on its way
  # to serving traffic. The writer waits for it and verifies the result.
  store-migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: store-migrator
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [backbone]
    environment:
      SEAGULL_EVENT_STORE_ADDRESS: clickhouse:9000
      SEAGULL_EVENT_STORE_DATABASE: ${SEAGULL_EVENT_STORE_DATABASE:-seagull}
      SEAGULL_EVENT_STORE_USER: ${SEAGULL_EVENT_STORE_USER:-seagull}
      SEAGULL_EVENT_STORE_PASSWORD: ${SEAGULL_EVENT_STORE_PASSWORD:-}
      SEAGULL_EVENT_STORE_TLS: ${SEAGULL_EVENT_STORE_TLS:-false}
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
    restart: "no"
    <<: *hardening

  # The relational store. Alerts are mutable, low volume and owned by a person,
  # which is the opposite of the analytical workload beside it.
  postgres:
    image: postgres:16.4-alpine
    networks: [backbone]
    environment:
      POSTGRES_DB: ${SEAGULL_ALERT_STORE_DATABASE:-seagull}
      POSTGRES_USER: ${SEAGULL_ALERT_STORE_USER:-seagull}
      POSTGRES_PASSWORD: ${SEAGULL_ALERT_STORE_PASSWORD:-seagull}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEAGULL_ALERT_STORE_USER:-seagull} -d ${SEAGULL_ALERT_STORE_DATABASE:-seagull}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applied by a command that runs to completion, never by a process on its way
  # to serving traffic. The writer and the control plane verify the result.
  alert-migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: alert-migrator
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backbone]
    environment:
      <<: *alertstore
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
    restart: "no"
    <<: *hardening

  # The rules are mounted rather than built in: the image is FROM scratch and
  # carries no filesystem, and a ruleset changes on its own cadence.
  analysis-engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: analysis-engine
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      backbone-migrator:
        condition: service_completed_successfully
    networks: [backbone]
    environment:
      <<: *backbone
      SEAGULL_DETECTION_RULES: /etc/seagull/rules
      SEAGULL_DETECTION_STATE_WINDOW: ${SEAGULL_DETECTION_STATE_WINDOW:-1h}
      # One engine reads the whole stream here, which is what lets a rule count
      # across agents. It is checked against the assignment, so scaling this
      # service stops it rather than halving what such a rule reports.
      SEAGULL_DETECTION_STATE_SOLE_READER: ${SEAGULL_DETECTION_STATE_SOLE_READER:-true}
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
      SEAGULL_OPS_ADDRESS: 0.0.0.0:9100
    volumes:
      - ./rules:/etc/seagull/rules:ro
    <<: *hardening

  event-writer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: event-writer
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      backbone-migrator:
        condition: service_completed_successfully
      store-migrator:
        condition: service_completed_successfully
    networks: [backbone]
    environment:
      <<: *backbone
      SEAGULL_EVENT_STORE_ADDRESS: clickhouse:9000
      SEAGULL_EVENT_STORE_DATABASE: ${SEAGULL_EVENT_STORE_DATABASE:-seagull}
      SEAGULL_EVENT_STORE_USER: ${SEAGULL_EVENT_STORE_USER:-seagull}
      SEAGULL_EVENT_STORE_PASSWORD: ${SEAGULL_EVENT_STORE_PASSWORD:-}
      SEAGULL_EVENT_STORE_TLS: ${SEAGULL_EVENT_STORE_TLS:-false}
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
      SEAGULL_OPS_ADDRESS: 0.0.0.0:9100
    <<: *hardening

  detection-writer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: detection-writer
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      backbone-migrator:
        condition: service_completed_successfully
      store-migrator:
        condition: service_completed_successfully
    networks: [backbone]
    environment:
      <<: *backbone
      SEAGULL_DETECTION_STORE_ADDRESS: clickhouse:9000
      SEAGULL_DETECTION_STORE_DATABASE: ${SEAGULL_DETECTION_STORE_DATABASE:-seagull}
      SEAGULL_DETECTION_STORE_USER: ${SEAGULL_DETECTION_STORE_USER:-seagull}
      SEAGULL_DETECTION_STORE_PASSWORD: ${SEAGULL_DETECTION_STORE_PASSWORD:-}
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
      SEAGULL_OPS_ADDRESS: 0.0.0.0:9100
    <<: *hardening

  # Opens a piece of work from what the engine decided. It consumes the same
  # topic as detection-writer in a group of its own, so a store it cannot reach
  # holds alerts and never telemetry.
  alert-writer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: alert-writer
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      backbone-migrator:
        condition: service_completed_successfully
      alert-migrator:
        condition: service_completed_successfully
    networks: [backbone]
    environment:
      <<: [*backbone, *alertstore]
      SEAGULL_ALERT_SEVERITY_FLOOR: ${SEAGULL_ALERT_SEVERITY_FLOOR:-medium}
      SEAGULL_ALERTING_DOCUMENT: /etc/seagull/alerting.yml
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
      SEAGULL_OPS_ADDRESS: 0.0.0.0:9100
    volumes:
      - ./alerting.yml:/etc/seagull/alerting.yml:ro
    <<: *hardening

  ingest-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: ingest-gateway
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      backbone-migrator:
        condition: service_completed_successfully
    networks: [backbone, agents]
    ports:
      - "${SEAGULL_GATEWAY_PUBLISH:-127.0.0.1:8443}:8443"
    environment:
      <<: *backbone
      SEAGULL_GATEWAY_ADDRESS: 0.0.0.0:8443
      SEAGULL_GATEWAY_TLS_CERT: /run/pki/gateway.pem
      SEAGULL_GATEWAY_TLS_KEY: /run/pki/gateway-key.pem
      SEAGULL_GATEWAY_AGENT_CA: /run/pki/agent-ca.pem
      SEAGULL_GATEWAY_MAX_INFLIGHT_BYTES: ${SEAGULL_GATEWAY_MAX_INFLIGHT_BYTES:-128MiB}
      SEAGULL_GATEWAY_MAX_INFLIGHT_REQUESTS: ${SEAGULL_GATEWAY_MAX_INFLIGHT_REQUESTS:-512}
      SEAGULL_TENANT_ID: ${SEAGULL_TENANT_ID:-default}
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
      SEAGULL_OPS_ADDRESS: 0.0.0.0:9100
    volumes:
      - ../.local/pki:/run/pki:ro
    <<: *hardening

  control-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: control-api
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      backbone-migrator:
        condition: service_completed_successfully
      alert-migrator:
        condition: service_completed_successfully
    networks: [backbone, agents]
    ports:
      - "${SEAGULL_CONTROL_API_PUBLISH:-127.0.0.1:8445}:8445"
    environment:
      <<: [*backbone, *alertstore]
      SEAGULL_CONTROL_API_ADDRESS: 0.0.0.0:8445
      SEAGULL_CONTROL_API_TLS_CERT: /run/pki/control-api.pem
      SEAGULL_CONTROL_API_TLS_KEY: /run/pki/control-api-key.pem
      SEAGULL_CONTROL_API_CALLER_CA: /run/pki/operator-ca.pem
      SEAGULL_CONTROL_API_POLICY: /etc/seagull/policy.yml
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
      SEAGULL_OPS_ADDRESS: 0.0.0.0:9100
    volumes:
      - ../.local/pki:/run/pki:ro
      - ./policy.yml:/etc/seagull/policy.yml:ro
    <<: *hardening

  # The read plane. It holds the only read connection to the store, consumes no
  # topic and writes nothing, so an expensive question cannot reach the pipeline
  # that is still admitting telemetry nor the surface an operator acts from. The
  # scope a query is answered within comes from the caller's certificate, so this
  # listener has no plaintext mode at all.
  query-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        COMPONENT: query-api
        VERSION: ${SEAGULL_VERSION:-dev}
    depends_on:
      store-migrator:
        condition: service_completed_successfully
    networks: [backbone, agents]
    ports:
      - "${SEAGULL_QUERY_API_PUBLISH:-127.0.0.1:8444}:8444"
    environment:
      SEAGULL_QUERY_API_ADDRESS: 0.0.0.0:8444
      SEAGULL_QUERY_API_TLS_CERT: /run/pki/query-api.pem
      SEAGULL_QUERY_API_TLS_KEY: /run/pki/query-api-key.pem
      SEAGULL_QUERY_API_CALLER_CA: /run/pki/operator-ca.pem
      SEAGULL_QUERY_STORE_ADDRESS: clickhouse:9000
      SEAGULL_QUERY_STORE_DATABASE: ${SEAGULL_EVENT_STORE_DATABASE:-seagull}
      SEAGULL_QUERY_STORE_USER: ${SEAGULL_EVENT_STORE_USER:-seagull}
      SEAGULL_QUERY_STORE_PASSWORD: ${SEAGULL_EVENT_STORE_PASSWORD:-}
      SEAGULL_LOG_LEVEL: ${SEAGULL_LOG_LEVEL:-info}
      SEAGULL_OPS_ADDRESS: 0.0.0.0:9100
    volumes:
      - ../.local/pki:/run/pki:ro
    <<: *hardening

volumes:
  redpanda: {}
  clickhouse: {}
  postgres: {}
